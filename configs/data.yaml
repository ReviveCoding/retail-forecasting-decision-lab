# Unified pipeline config for Retail Forecasting Lab.
# Edit this single file for local runs. Keep sample_mode=true for the first run.
data:
  m5_zip_path: /mnt/data/m5-forecasting-accuracy.zip
  sample_mode: true
  n_items: 30
  n_stores: 2
  max_days: 420
  forecast_horizon_days: 28
  validation_horizon_days: 28
  random_seed: 42
  output_dir: outputs
  report_dir: reports

model:
  model_type: random_forest_tree_ensemble
  random_seed: 42
  n_estimators: 80
  max_depth: 12
  min_samples_leaf: 2

features:
  lifecycle_reference_days: 365

inventory:
  lead_times: [1, 3, 7, 14]
  safety_stock_factors: [0.0, 0.5, 1.0]
  holding_cost_per_unit: 0.25
  lost_sales_cost_per_unit: 1.0
  labor_units_per_demand_unit: 0.02
  write_detail_outputs: false
  detail_sample_rows: 5000

experiment:
  unit_type: item-store-week
  control_policy: tree_ensemble_policy
  treatment_policy: risk_safe_corrected_policy
  lead_time: 7
  safety_stock_factor: 0.5
  n_bootstrap: 200
  random_seed: 42

release_gate:
  control_forecast: tree_ensemble
  treatment_forecast: corrected
  control_policy: tree_ensemble_policy
  treatment_policy: risk_safe_corrected_policy
  lead_time: 7
  safety_stock_factor: 0.5
  thresholds:
    min_wape_relative_improvement: 0.01
    min_under_forecast_relative_improvement: 0.03
    max_overstock_relative_worsening: 0.02
    max_total_cost_relative_worsening: 0.02
    max_worst_slice_wape_relative_worsening: 0.02
    require_ci_sign_stable_for_launch: false

explainability:
  n_cases: 25
  negative_control_cases: 5
