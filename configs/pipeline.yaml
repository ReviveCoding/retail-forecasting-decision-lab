project:
  name: "Retail Forecasting Decision Lab"

data:
  m5_path: "data/raw/m5-forecasting-accuracy.zip"
  m5_format: "auto"
  sample_mode: true
  n_items: 30
  n_stores: 2
  max_days: 420
  write_detail_outputs: false

model:
  random_seed: 42
  model_type: "hist_gradient_boosting"
  fallback_model_type: "random_forest"

inventory:
  lead_times: [1, 3, 7, 14]
  safety_stock_factors: [0.0, 0.5, 1.0]
  holding_cost_per_unit: 0.25
  lost_sales_cost_per_unit: 1.0

experiment:
  unit_type: "item-store-week"
  cluster_key: "item_store_id"
  n_bootstrap: 200
  control_policy: "tree_ensemble_policy"
  treatment_policy: "risk_safe_corrected_policy"

release_gate:
  min_wape_relative_improvement: 0.01
  min_under_forecast_relative_improvement: 0.03
  max_overstock_relative_worsening: 0.02
  max_total_cost_relative_worsening: 0.02
  max_worst_slice_wape_relative_worsening: 0.02

extensions:
  enable_favorita: false
  favorita_path: "data/external/favorita"

  enable_rossmann: false
  rossmann_path: "data/external/rossmann"

  enable_olist: false
  olist_path: "data/external/olist"

  enable_instacart: false
  instacart_path: "data/external/instacart"

  enable_online_retail_ii: false
  online_retail_ii_path: "data/external/online_retail_ii"

gpu_residual:
  enabled: true
  device: "cuda"
  epochs: 20
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  hidden_dims: [128, 64]
  dropout: 0.10

  split:
    train_base_end: 0.60
    residual_fit_end: 0.75
    guard_val_end: 0.85

  guard:
    lambda_grid: [0.10, 0.20, 0.30, 0.40, 0.50, 0.75, 1.00]
    clip_quantile_grid: [0.80, 0.90, 0.95]
    selection_metric: "balanced"